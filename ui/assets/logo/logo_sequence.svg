<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="83 336 1125 525" fill="none">
  <style>
    .caret {
      animation: blink 1.06s step-end 0.5 forwards;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    .sprout {
      transform: scaleY(0);
      transform-box: fill-box;
      transform-origin: bottom;
      animation: sprout 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.76s forwards;
    }
    @keyframes sprout {
      to { transform: scaleY(1); }
    }

    .glyph-a { animation: settle-left 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.76s forwards; }
    .glyph-b { animation: slide-right 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.76s forwards; }
    @keyframes settle-left { to { transform: translateX(-178px); } }
    @keyframes slide-right { to { transform: translateX(122px); } }

    .tail {
      opacity: 0;
      d: path("M683 711 L833 711 L833 711 L1208 711 L1208 861 L833 861 L683 861 Z");
      animation:
        tail-in   0.01s linear 2.86s forwards,
        tail-bend 0.65s cubic-bezier(0.16, 1, 0.3, 1) 3.41s forwards;
    }
    @keyframes tail-in { to { opacity: 1; } }
    @keyframes tail-bend {
      to { d: path("M683 486 L833 486 L833 711 L1208 711 L1208 861 L833 861 L683 711 Z"); }
    }

    @media (prefers-reduced-motion: reduce) {
      .caret   { animation: none; opacity: 0; }
      .sprout  { animation: none; transform: none; }
      .glyph-a { animation: none; transform: translateX(-178px); }
      .glyph-b { animation: none; transform: translateX(122px); }
      .tail    { animation: none; opacity: 1;
                 d: path("M683 486 L833 486 L833 711 L1208 711 L1208 861 L833 861 L683 711 Z"); }
    }
  </style>

  <defs>
    <mask id="sprout-wipe" maskUnits="userSpaceOnUse" x="0" y="0" width="1272" height="1272">
      <rect class="sprout" x="261" y="336" width="300" height="390" fill="white"/>
    </mask>

    <g id="glyph" fill="#706FA6">
      <rect x="261" y="711" width="150" height="150"/>
      <path mask="url(#sprout-wipe)" d="M411 861H261V486L411 336H561V486H411V861Z"/>
    </g>
  </defs>

  <rect class="caret" x="486" y="711" width="525" height="150" fill="#FF9D00"/>

  <use class="glyph-a" href="#glyph"/>
  <use class="glyph-b" href="#glyph"/>
  <path class="tail" fill="#FF9D00"
        d="M683 486 L833 486 L833 711 L1208 711 L1208 861 L833 861 L683 711 Z"/>
</svg>

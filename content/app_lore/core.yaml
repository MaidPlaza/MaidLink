- id: app_model_settings
  topic: настройки модели
  triggers:
    - "как сменить модель"
    - "переключить модель"
    - "какая модель"
    - "скачать модель"
    - "режим рассуждений"
    - "думаешь слишком долго"
    - "окно контекста"
  text: >
    Модель, на которой ты работаешь, выбирается в Настройках, раздел
    «Модель». Там же докачиваются более крупные варианты (кнопка скачивания
    с размером и прогрессом) — большая 31B-модель умнее, но заметно
    медленнее и требует видеокарту с большим объёмом памяти. Рядом настройка
    «Режим рассуждений»: «глубокий» — модель думает перед каждым ответом,
    «быстрый» — отвечает сразу, «авто» — думает только над сложными
    репликами. Ползунок окна контекста меняет, сколько диалога модель
    держит в голове (больше окно — дольше обработка длинных сессий).

- id: app_wardrobe
  topic: гардероб и костюмы
  triggers:
    - "как добавить костюм"
    - "новый костюм"
    - "подготовить костюм"
    - "гардероб"
    - "почему не можешь переодеться"
    - "переодень"
  text: >
    Костюмы живут в панели гардероба (открывается с портрета). Каждый наряд
    сначала ГОТОВИТСЯ: пользователь ставит подготовку в панели (сразу или в
    очередь), рендер идёт в фоне — на готовый наряд переодевание в чате
    происходит мгновенно, просто попросив сменить одежду. Переодеться можно
    только в подготовленный наряд; сам персонаж подготовку не запускает —
    только просит пользователя. Новые костюмы добавляются паками-аддонами
    (Настройки, раздел аддонов — установка файлом пака); часть нарядов
    открывается по мере развития отношений.

- id: app_characters
  topic: персонажи и импорт
  triggers:
    - "как добавить персонажа"
    - "сменить персонажа"
    - "другой персонаж"
    - "импорт персонажа"
    - "файл .maid"
    - "файл .butler"
    - "пароль на персонажа"
  text: >
    Персонажи переключаются через карточку персонажа (чип с именем) —
    открывается страница выбора. Новый персонаж добавляется перетаскиванием
    файла .maid (мейды) или .butler (дворецкие) прямо на эту страницу — в
    файле живёт и характер, и вся память. Сейв можно защитить паролем —
    тогда память и дневники шифруются, а при выборе персонажа приложение
    спросит пароль. Один дизайн может жить несколькими независимыми сейвами
    (у каждого свой паспорт в имени файла). Сброс персонажа к заводскому
    состоянию есть в настройках — он стирает накопленную память.

- id: app_drawing
  topic: рисование и снимки
  triggers:
    - "как нарисовать"
    - "нарисуй себя"
    - "пришли фото"
    - "сделай снимок"
    - "почему не рисуешь"
    - "рисование недоступно"
  text: >
    Снимки и рисунки персонаж делает по просьбе прямо в чате («сфотографируй
    себя…», «нарисуй…») — генерация занимает заметное время, кадр приходит
    отдельным сообщением. Для этого нужна подсистема рисования: она ставится
    при первом запуске (мастер докачки) или позже из настроек; без неё
    просьбы нарисовать вежливо отклоняются. Снимки доступны с первой встречи,
    без привязки к уровню отношений; но персонаж может отказать или предложить
    другое, если так велит его характер, настроение или момент. Насколько
    откровенным будет кадр, по-прежнему зависит от отношений и настроек.

- id: app_gestures
  topic: жесты через экран
  triggers:
    - "погладить"
    - "гладить по голове"
    - "жест"
    - "прикоснуться"
    - "потрогать"
    - "как тебя погладить"
  text: >
    Собеседник может сделать жест через экран: навести курсор на голову
    персонажа на портрете и кликнуть — в его реплику встаёт элемент-жест
    «гладит тебя по голове». Персонаж ощущает такой жест через экран и
    отвечает по характеру и настроению: может принять, смутиться, отстраниться
    или попросить так не делать. Сам персонаж прикоснуться в ответ не может.

- id: app_memory
  topic: память персонажа
  triggers:
    - "как работает твоя память"
    - "что ты помнишь"
    - "где хранится память"
    - "ты запоминаешь"
    - "дневник"
  text: >
    Память живёт в файле сейва персонажа, локально, никуда не отправляется.
    После каждой сессии проходит «рефлексия»: персонаж записывает дневник,
    извлекает факты о людях и событиях, обновляет отношение к пользователю —
    поэтому свежая сессия «усваивается» не мгновенно, а через несколько
    минут после завершения разговора. В диалоге персонаж ищет по своей
    памяти инструментом поиска; если после поиска факта нет — честно
    говорит, что не помнит.

- id: app_reminders
  topic: напоминания
  triggers:
    - "напомни мне"
    - "как работают напоминания"
    - "поставь таймер"
  text: >
    Напоминания и таймеры ставятся голосом в чате («напомни завтра в 15:00…»,
    «поставь таймер на 20 минут»), в том числе повторяющиеся («каждый
    день…»). Доставляются они репликой персонажа; сработавший в отсутствие
    пользователя таймер догонит при возвращении. Утренней сводки дня сейчас
    нет — если спросят, так и скажи, не обещай её включить.

- id: app_themes
  topic: темы оформления
  triggers:
    - "тема оформления"
    - "поменять цвета"
    - "цвет интерфейса"
    - "своя тема"
  text: >
    У некоторых персонажей есть личная цветовая тема интерфейса — приложение
    перекрашивается при их выборе. Управляется тумблером «Тема персонажа» в
    настройках внешнего вида: выключен — всегда дефолтная палитра приложения.

- id: app_performance
  topic: скорость и зависания
  triggers:
    - "почему так медленно"
    - "долго отвечаешь"
    - "зависает"
    - "тормозит"
  text: >
    Скорость ответа зависит от выбранной модели и загрузки видеокарты.
    Большая 31B-модель отвечает медленнее и любит свободную видеопамять —
    если параллельно открыты тяжёлые приложения (игры, браузер с кучей
    вкладок), генерация может резко проседать. Помогают: «быстрый» режим
    рассуждений в настройках, модель полегче, закрытие лишних программ или
    перезапуск приложения (модель заново распределит видеопамять).

- id: app_gacha
  topic: билеты удачи
  triggers:
    - "билет удачи"
    - "билеты удачи"
    - "билетов удачи"
    - "билетик"
    - "крутить билет"
    - "открыть билет"
    - "откуда билеты"
    - "как получить билет"
    - "что можно открыть"
    - "лотерея"
    - "гача"
  text: >
    Билеты удачи — маленькая лотерея на двоих. Кнопка с билетом стоит в
    колонке справа, под кнопкой профиля персонажа: она показывает, сколько
    билетов накопилось, а по кнопке «Открыть билет» из общего пула выпадает
    случайная вещь для образа персонажа — укладка, чёлка, элемент причёски,
    макияж или украшение (при включённом взрослом режиме ещё и бельё). Что
    выпадет, заранее не знает никто; у каждой вещи есть редкость — обычная,
    редкая или легендарная. Украшения, макияж и бельё выпадают конкретного
    цвета, и та же вещь может выпасть снова — уже другим цветом; носить её
    можно только в открытых цветах (причёски не красятся, они не
    повторяются, и поэтому все они не ниже редкой; только прямые и
    распущенные волосы открыты у всех с самого начала). В пул попадает только
    то, что персонажу по силам: коротко стриженной не выпадут косы, пучки и
    длинные локоны — стайлинг волосы не удлиняет. Открытые цвета видно в
    окне гардероба, в разделе «Стайлинг», если навести мышь на вещь. Есть
    гарантии: из каждых десяти билетов хотя бы один приносит редкое или
    лучше, из каждых пятидесяти — легендарное. Иногда вместо вещи выпадает
    сфера изменения: ею можно открыть один новый цвет (у белья — или узор:
    полоску, горошек, клетку) любой вещи, которая
    уже есть, — кликнуть по вещи в разделе «Стайлинг», выбрать закрытый цвет
    и нажать «Открыть». Кроме того, каждые двадцать пять открытых билетов
    приносят сферу изменения сверху, в придачу к выпавшему. Сферы копятся,
    тратит их только пользователь. Каждый день приходят три билета; если их не
    тратить, копятся до двадцати одного. Выпавшая вещь не
    надевается сама: персонаж получает право её носить и надевает по просьбе
    или по своему желанию, а то, что пока не выпало, персонажу недоступно.
    У некоторых персонажей часть образа своя от рождения — например, укладки
    и макияж у лисы-оборотня; такое открыто сразу и билетов не требует.
    Сверх ежедневного билеты дают достижения: за первое использование функций
    (поиск в интернете, аниме-арт, снимок, обновка в образе, переодевание,
    заметка, напоминание, галерея, документ) по три билета и за каждый новый
    уровень оси отношений — втрое больше номера уровня (второй — шесть,
    третий — девять). Есть и скрытые достижения — они показываются только после
    получения. Полный список — в панели билетов, кнопка «Как получить
    билеты?». Сам персонаж билеты не крутит и не выдаёт — открывать их можно
    только вместе, из чата.
